services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-prueba_coches}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: python:3.12-slim
    working_dir: /app/migraciones
    volumes:
      - ./backend/migraciones:/app/migraciones
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_NAME: ${DB_NAME:-prueba_coches}
    command: sh -c "pip install -q -r requirements.txt && python migrate.py && python seed.py"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_NAME: ${DB_NAME:-prueba_coches}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-en-produccion}
      JWT_EXPIRES: 8h
      CLIENT_URL: http://localhost:8080
    ports:
      - "3001:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
